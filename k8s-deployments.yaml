---
# User Authentication Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-authentication-service
  namespace: ronnie-dev
  labels:
    app: user-authentication-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-authentication-service
  template:
    metadata:
      labels:
        app: user-authentication-service
    spec:
      containers:
      - name: echo-server
        image: ealen/echo-server:latest
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          value: "8001"
---
apiVersion: v1
kind: Service
metadata:
  name: user-authentication-service
  namespace: ronnie-dev
spec:
  selector:
    app: user-authentication-service
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP
